name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:        # reused by release.yml before publishing

jobs:
  # The job name below is a required status check on main; keep it stable.
  smoke:
    name: smoke (zsh on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax check
        run: |
          python3 -c "import ast,sys; [ast.parse(open(f).read()) for f in ('zorua_core.py', 'zorua_providers.py', 'zorua_statusline.py')]"
          zsh -n zorua.zsh
          sh -n install.sh
          sh -n uninstall.sh
          sh -n web/launchd/zorua-web.sh

      - name: Python feature tests (isolated HOME and fake Keychain)
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: zsh smoke tests
        run: zsh tests/smoke.zsh

      # macOS ships bash 3.2 and BSD userland: the setup most users of this tool actually have.
      - name: bash smoke tests (system bash 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash tests/smoke.bash

  shells:
    name: smoke (bash + fish, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest is Ubuntu 26.04, which has no setup-python build of 3.8.
          - python: "3.8"
            os: ubuntu-24.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      # Real mistakes only (undefined names, unused imports, syntax): no style rules.
      - name: Lint Python (pyflakes rules)
        if: matrix.python == '3.12'
        run: |
          python -m pip install --quiet ruff
          ruff check --select F,E9 --no-cache zorua_core.py zorua_providers.py zorua_statusline.py web/tests/api_test.py web/tests/ui/fixture_core.py

      - name: Syntax check
        run: |
          bash -n zorua.bash
          fish -n zorua.fish

      - name: bash smoke tests
        run: bash tests/smoke.bash

      - name: fish smoke tests
        run: fish tests/smoke.fish

  # The dashboard in web/ is separate from the Python program: typecheck, build and run its API tests
  # (tests/run.sh starts the built server in an isolated HOME with fake claude/codex CLIs).
  web:
    name: web (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Demo build
        run: sh demo/build.sh "$RUNNER_TEMP/zorua-demo"

      # docs/demo is committed (GitHub Pages serves docs/) and has to be rebuilt by hand: fail when it is behind.
      - name: Is docs/demo up to date?
        run: sh demo/check-fresh.sh "$RUNNER_TEMP/zorua-demo"

      - name: API tests
        run: npm test

      # Starts the built server against a fake core and drives it with the runner's Chrome.
      - name: UI tests
        run: npm run test:ui
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CI: "true"

  install-e2e:
    name: install E2E (fresh user, ubuntu:24.04)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh, fish and python3
        run: |
          apt-get update
          apt-get install -y --no-install-recommends zsh fish python3

      - name: Install-time end-to-end test
        run: zsh tests/install-e2e.zsh
        env:
          ZORUA_E2E_SRC: ${{ github.workspace }}
